<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Súper">
<meta name="theme-color" content="#FAFAF8">
<title>Cuenta del súper</title>
<style>
:root{
  --bg1:#1a2332;
  --bg2:#0d1119;
  --card:rgba(255,255,255,0.03);
  --card2:rgba(255,255,255,0.04);
  --stroke:rgba(255,255,255,0.08);
  --ink:#F5F9FC;
  --ink2:#8B99A8;
  --ink3:#5C6B7A;
  --acc:#00E58A;
  --acc2:#00A9C4;
  --alert:#FF6B5B;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg2)}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
  background:radial-gradient(circle at 30% -5%, var(--bg1) 0%, var(--bg2) 55%) fixed;
  background-color:var(--bg2);
  padding:0 0 calc(28px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:0 15px}
.brand{display:flex;justify-content:space-between;align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 2px 16px}
.brand .id{display:flex;align-items:center;gap:9px}
.brand .mark{width:28px;height:28px;border-radius:9px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;color:#08130D;font-size:15px}
.brand .nm{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.brand .dt{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* ===== panel del total (vidrio) ===== */
.panel{
  position:sticky;top:8px;z-index:40;
  background:var(--card2);border:1px solid var(--stroke);border-radius:22px;
  padding:20px 18px;margin-bottom:14px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
.eyebrow{font-size:11px;color:var(--ink2);margin:0 0 8px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase}
.amount{display:flex;align-items:baseline;gap:5px;margin:0}
.amount span{font-size:22px;font-weight:500;color:var(--ink3)}
.amount b{font-size:46px;line-height:1;font-weight:700;color:var(--ink);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amount .cents{color:var(--ink3);font-weight:700}
.amount.over b,.amount.over span{color:var(--alert)}
.amount.over .cents{color:var(--alert);opacity:.6}
.pulse{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
.bar{height:8px;background:rgba(255,255,255,0.06);border-radius:6px;
  overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  box-shadow:0 0 12px rgba(0,229,138,.5);transition:width .35s cubic-bezier(.34,1.2,.64,1)}
.bar i.over{background:var(--alert);box-shadow:0 0 12px rgba(255,107,91,.5)}
.meta{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}
.meta #cnt{color:var(--ink2)}
.meta #left{color:var(--acc);font-weight:600}
.meta #left.over{color:var(--alert)}
.meta #left:empty{display:none}
/* ===== botones ===== */
.acts{display:flex;gap:8px;margin-bottom:20px}
button{font-family:var(--sans);font-size:16px;cursor:pointer;border-radius:15px}
.act{flex:1;padding:15px 12px;font-weight:600;font-size:14px;border:0;
  background:var(--card2);border:1px solid var(--stroke);color:#C5D0DB;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s}
.act.fill{flex:1.4;background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#08130D;border:0;box-shadow:0 6px 20px rgba(0,229,138,.28)}
.act:active{transform:scale(.97)}
.act i{font-size:18px}
.mini{background:none;border:0;color:var(--ink3);font-size:13px;padding:10px 4px;font-weight:500}
.mini.warn{color:var(--alert)}
/* ===== lista ===== */
.ticket{padding:0}
.tear{display:none}
.thead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
.thead h1{font-size:11px;font-weight:600;color:var(--ink3);margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.thead p{font-size:11px;color:var(--ink3);margin:0}
.ln{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:16px;
  padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  animation:slidein .3s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ln .ico{width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:rgba(0,229,138,.12);color:var(--acc)}
.ln:nth-child(odd) .ico{background:rgba(0,169,196,.12);color:#00C4D6}
.ln .info{flex:1;min-width:0;cursor:pointer}
.ln .nm{font-size:14px;font-weight:600;color:#E8EDF2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .det{font-size:11px;color:#6B7A89;margin-top:2px;font-variant-numeric:tabular-nums}
.ln .dots{display:none}
.ln .pz{font-size:15px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.itbms{font-size:9px;background:rgba(255,255,255,0.08);color:#8B99A8;
  padding:2px 6px;border-radius:20px;margin-left:6px;vertical-align:1px;font-weight:600}
.qty{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.qty button{width:26px;height:26px;padding:0;font-size:16px;line-height:1;border:0;border-radius:8px;
  background:rgba(255,255,255,0.06);color:#C5D0DB}
.qty button:last-of-type{background:rgba(0,229,138,.15);color:var(--acc)}
.qty span{font-size:12px;font-weight:600;min-width:16px;text-align:center;color:#C5D0DB;
  font-variant-numeric:tabular-nums}
.rm{border:0;background:none;color:var(--alert);font-size:12px;padding:4px 2px;font-weight:500}
.ln .bot{display:none}
.sums{background:var(--card2);border:1px solid var(--stroke);border-radius:16px;
  padding:14px 16px;margin-top:4px}
.sums div{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);
  padding:3px 0;font-variant-numeric:tabular-nums}
.sums div.big{color:var(--ink);font-size:17px;font-weight:700;padding-top:10px;margin-top:6px;
  border-top:1px solid var(--stroke)}
.code{display:none}
.codetxt{display:none}
.blank{text-align:center;padding:46px 24px;color:var(--ink2);font-size:14.5px;line-height:1.6}
.blank i{font-size:34px;color:var(--ink3);display:block;margin-bottom:12px}
/* ===== cámara ===== */
#cam{position:fixed;inset:0;background:#000;z-index:100;display:none}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .box{position:absolute;top:50%;left:8%;width:84%;height:150px;margin-top:-75px;
  box-shadow:0 0 0 2000px rgba(6,10,8,.6);border-radius:12px}
#cam .box i{position:absolute;width:28px;height:28px;border:3px solid var(--acc)}
#cam .box i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
#cam .box i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
#cam .box i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 12px}
#cam .box i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 12px 0}
#cam .scan{position:absolute;left:6px;right:6px;height:2px;background:var(--acc);
  top:14px;box-shadow:0 0 10px var(--acc);animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(0)}50%{transform:translateY(118px)}}
#cam .hint{position:absolute;top:calc(26px + env(safe-area-inset-top));left:0;right:0;
  text-align:center;color:#fff;font-size:14.5px;padding:0 24px}
#cam .close{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#08130D;border:0;border-radius:30px;padding:15px 40px;font-size:16px;font-weight:600}
#cam .torch{position:absolute;top:calc(26px + env(safe-area-inset-top));right:16px;
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;font-size:19px;display:none;
  align-items:center;justify-content:center;padding:0}
#cam .torch.show{display:flex}
#cam .torch.on{background:var(--acc);color:#08130D;border-color:var(--acc)}
/* ===== hoja modal (vidrio) ===== */
#modal{position:fixed;inset:0;background:rgba(6,10,15,.6);z-index:120;display:none;
  align-items:flex-end;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#modal .sheet{background:#141b26;color:var(--ink);width:100%;max-width:560px;margin:0 auto;
  border:1px solid var(--stroke);border-bottom:0;border-radius:24px 24px 0 0;padding:24px 18px;
  max-height:93vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  animation:sheetup .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes sheetup{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#modal h2{font-size:18px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
#modal .sub{font-size:12px;color:var(--ink3);margin:0 0 18px}
label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin:16px 0 7px;
  text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number]{width:100%;font-size:16px;padding:14px 13px;
  border:1px solid var(--stroke);border-radius:13px;background:rgba(255,255,255,0.04);
  color:var(--ink);font-family:var(--sans)}
input[type=number]{font-weight:600;font-variant-numeric:tabular-nums}
input::placeholder{color:var(--ink3)}
input:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.seg{display:flex;border:1px solid var(--stroke);border-radius:13px;overflow:hidden;
  background:rgba(255,255,255,0.04)}
.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink2);
  padding:14px 8px;font-size:14.5px;font-weight:500}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#08130D;font-weight:600}
.chk{display:flex;align-items:center;gap:11px;margin-top:18px}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:0 0 auto}
.chk label{margin:0;font-size:15px;color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0}
.err{color:var(--alert);font-size:13.5px;margin:10px 0 0;display:none}
.sheet .acts{margin:22px 0 0}
.sheet .act{border:1px solid var(--stroke);background:rgba(255,255,255,0.04);color:#C5D0DB}
.sheet .act.fill{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#08130D;border:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="id">
      <div class="mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/><path d="M3 4h2l2 11h10l2 -7h-13"/></svg></div>
      <span class="nm">Mi compra</span>
    </div>
    <span class="dt" id="brandDate"></span>
  </div>
  <div class="panel">
    <p class="eyebrow" id="eyebrow">Total a pagar</p>
    <p class="amount" id="amount"><span>B/.</span><b id="total">0.00</b></p>
    <div class="bar" id="bar" style="display:none"><i id="fill"></i></div>
    <div class="meta">
      <span id="cnt">0 artículos</span>
      <span id="left"></span>
    </div>
  </div>
  <div class="acts">
    <button class="act fill" id="btnScan"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v-1a2 2 0 0 1 2 -2h2"/><path d="M4 17v1a2 2 0 0 0 2 2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v1"/><path d="M16 20h2a2 2 0 0 0 2 -2v-1"/><path d="M5 12h14"/></svg>Escanear</button>
    <button class="act" id="btnManual">Manual</button>
  </div>
  <div class="ticket" id="ticket"></div>
  <div class="acts">
    <button class="mini" id="btnBudget">Presupuesto</button>
    <button class="mini warn" id="btnClear">Nueva compra</button>
  </div>
</div>
<div id="cam">
  <video id="video" playsinline muted></video>
  <div class="box"><i></i><i></i><i></i><i></i><div class="scan"></div></div>
  <p class="hint" id="camhint">Apunta al código de barras</p>
  <button class="torch" id="btnTorch" title="Linterna">🔦</button>
  <button class="close" id="btnCamClose">Cerrar</button>
</div>
<div id="modal">
  <div class="sheet">
    <h2 id="mTitle">Producto nuevo</h2>
    <p class="sub" id="mCode"></p>
    <label for="mName">Nombre</label>
    <input type="text" id="mName" placeholder="Leche 1L" autocomplete="off">
    <label>Se cobra por</label>
    <div class="seg"><button id="segUnit" class="on">Unidad</button><button id="segWeight">Peso (libra)</button></div>
    <label for="mPrice" id="mPriceLbl">Precio</label>
    <input type="number" id="mPrice" inputmode="decimal" step="0.01" placeholder="0.00">
    <div id="wBox" style="display:none">
      <label for="mWeight">Libras en la etiqueta</label>
      <input type="number" id="mWeight" inputmode="decimal" step="0.01" placeholder="0.00">
    </div>
    <div class="chk"><input type="checkbox" id="mTax"><label for="mTax">Paga ITBMS (7%)</label></div>
    <p class="err" id="mErr"></p>
    <div class="acts">
      <button class="act" id="mCancel">Cancelar</button>
      <button class="act fill" id="mSave">Guardar</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
var ITBMS=0.07, cat={}, cart=[], budget=0;
var mode='unit', editIndex=-1, pendingCode='', prevTotal=0;
var reader=null, controls=null, lastCode='', lastTime=0;
var torchOn=false, torchCheckTimer=null;
function load(){
  try{
    cat=JSON.parse(localStorage.getItem('super_cat')||'{}');
    cart=JSON.parse(localStorage.getItem('super_cart')||'[]');
    budget=parseFloat(localStorage.getItem('super_budget')||'0')||0;
  }catch(e){cat={};cart=[];budget=0;}
}
function save(){
  try{
    localStorage.setItem('super_cat',JSON.stringify(cat));
    localStorage.setItem('super_cart',JSON.stringify(cart));
    localStorage.setItem('super_budget',String(budget));
  }catch(e){}
}
function n2(n){return (Math.round(n*100)/100).toFixed(2);}
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function lineOf(it){return Math.round((it.tipo==='peso'?it.precio*it.peso:it.precio*it.cant)*100)/100;}
function totalHtml(v){
  var s=n2(v), p=s.split('.');
  return p[0]+'<span class="cents">.'+p[1]+'</span>';
}
var ICONS={
  bottle:'<path d="M10 5h4"/><path d="M10 3h4v2a4 4 0 0 1 -.4 1.7l-1 2a5 5 0 0 0 -.6 2.3v6a2 2 0 0 1 -2 2h0a2 2 0 0 1 -2 -2v-6a5 5 0 0 0 -.6 -2.3l-1 -2a4 4 0 0 1 -.4 -1.7z" transform="translate(2 0)"/>',
  apple:'<path d="M12 8c-1.5 -2 -3 -3 -5 -3a4 4 0 0 0 -4 4c0 4 3 8 6 9c1 .3 2 .3 3 0c3 -1 6 -5 6 -9a4 4 0 0 0 -4 -4c-2 0 -3.5 1 -5 3"/><path d="M12 8v-2a2 2 0 0 1 2 -2"/>',
  bread:'<path d="M17 5c1.7 0 3 1.3 3 3c0 1 -.5 2 -1.5 2.5l0 7.5a1 1 0 0 1 -1 1h-11a1 1 0 0 1 -1 -1l0 -7.5c-1 -.5 -1.5 -1.5 -1.5 -2.5c0 -1.7 1.3 -3 3 -3z"/>',
  meat:'<path d="M13.5 10.5l-4 4"/><path d="M10 6a5 5 0 0 0 -7 5a3 3 0 0 0 -1 2.5a3 3 0 0 0 3 3a3 3 0 0 0 2.5 -1a5 5 0 0 0 5 -7"/><path d="M14 6.5a3.5 3.5 0 1 1 4 4"/>',
  cheese:'<path d="M4 13l16 0l-8.5 -7z"/><path d="M4 13v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-3"/><circle cx="9" cy="16" r=".5"/><circle cx="14" cy="15.5" r=".5"/>',
  candy:'<circle cx="12" cy="12" r="4"/><path d="M15 9l4 -3l0 5"/><path d="M9 15l-4 3l0 -5"/>',
  spray:'<path d="M7 9h6v11a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/><path d="M9 9v-3h2v3"/><path d="M13 4h2"/><path d="M13 7h3"/><path d="M16 10h1"/>',
  paw:'<circle cx="8" cy="9" r="1.5"/><circle cx="16" cy="9" r="1.5"/><circle cx="6" cy="13" r="1.5"/><circle cx="18" cy="13" r="1.5"/><path d="M12 21a3 3 0 0 1 -3 -3c0 -2 1.5 -3 3 -5c1.5 2 3 3 3 5a3 3 0 0 1 -3 3z"/>',
  bag:'<path d="M6 8h12l-1 12a1 1 0 0 1 -1 1h-8a1 1 0 0 1 -1 -1z"/><path d="M9 8a3 3 0 0 1 6 0"/>'
};
function svg(name){
  return '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.bag)+'</svg>';
}
function iconoDe(nombre){
  var s=(nombre||'').toLowerCase();
  var reglas=[
    ['bottle','leche|agua|jugo|refresco|soda|gaseosa|bebida|cerveza|vino|aceite|vinagre'],
    ['apple','manzana|fruta|banano|guineo|naranja|pera|uva|fresa|mango|piña|papaya|sandia|melon|tomate|verdura|lechuga|cebolla|papa|zanahoria|vegetal'],
    ['bread','pan|galleta|torta|bizcocho|dona|reposteria|harina|pasta|arroz|cereal|avena'],
    ['meat','carne|pollo|res|cerdo|pescado|jamon|salchicha|chorizo|bistec|molida'],
    ['cheese','queso|mantequilla|yogur|yogurt|crema|huevo|lacteo'],
    ['candy','dulce|chocolate|caramelo|chicle|snack|papas|chips|helado'],
    ['spray','jabon|detergente|cloro|limpiador|desinfectante|shampoo|papel|servilleta|higienico'],
    ['paw','perro|gato|mascota']
  ];
  for(var i=0;i<reglas.length;i++){
    var pats=reglas[i][1].split('|');
    for(var j=0;j<pats.length;j++) if(s.indexOf(pats[j])>=0) return reglas[i][0];
  }
  return 'bag';
}
function totals(){
  var sub=0,tax=0;
  for(var i=0;i<cart.length;i++){var L=lineOf(cart[i]);sub+=L;if(cart[i].itbms)tax+=L*ITBMS;}
  tax=Math.round(tax*100)/100;
  return {sub:sub,tax:tax,total:sub+tax};
}
function render(){
  var t=totals(), over=budget>0&&t.total>budget;
  document.getElementById('total').innerHTML=totalHtml(t.total);
  document.getElementById('amount').className='amount'+(over?' over':'');
  document.getElementById('eyebrow').textContent=over?'Pasaste el presupuesto':'Total a pagar';
  if(t.total!==prevTotal){
    var a=document.getElementById('amount');
    a.classList.remove('pulse'); void a.offsetWidth; a.classList.add('pulse');
    prevTotal=t.total;
  }
  var n=0;for(var i=0;i<cart.length;i++)n+=cart[i].tipo==='peso'?1:cart[i].cant;
  document.getElementById('cnt').textContent=n+(n===1?' artículo':' artículos');
  document.getElementById('left').textContent = budget>0
    ? (over?'te pasaste B/. '+n2(t.total-budget):'te quedan B/. '+n2(budget-t.total))
    : '';
  var bar=document.getElementById('bar');
  if(budget>0){
    bar.style.display='block';
    var f=document.getElementById('fill');
    f.style.width=Math.min(100,(t.total/budget)*100)+'%';
    f.className=over?'over':'';
  } else bar.style.display='none';
  var h='';
  if(!cart.length){
    h+='<div class="blank"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 12px"><path d="M5 11h14l-1 7a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/><path d="M9 11l2 -6"/><path d="M15 11l-2 -6"/></svg>Tu compra está vacía.<br>Escanea el primer producto — la app te pregunta el precio una sola vez y lo recuerda.</div>';
  } else {
    h+='<div class="thead"><h1>'+n+(n===1?' producto':' productos')+'</h1><p>Toca para editar</p></div>';
    for(var i=0;i<cart.length;i++){
      var it=cart[i];
      var det=it.tipo==='peso' ? 'B/. '+n2(it.precio)+' × '+it.peso.toFixed(2)+' lb'
                               : 'B/. '+n2(it.precio)+' c/u';
      h+='<div class="ln">'
       +  '<div class="ico">'+svg(iconoDe(it.nombre))+'</div>'
       +  '<div class="info" onclick="editar('+i+')">'
       +    '<div class="nm">'+esc(it.nombre)+(it.itbms?'<span class="itbms">ITBMS</span>':'')+'</div>'
       +    '<div class="det">'+det+'</div>'
       +  '</div>';
      if(it.tipo==='peso'){
        h+= '<span class="pz">'+n2(lineOf(it))+'</span>'
          + '<button class="rm" onclick="quitar('+i+')">quitar</button>';
      } else {
        h+= '<div class="qty"><button onclick="menos('+i+')" aria-label="Quitar uno">−</button>'
          + '<span>'+it.cant+'</span>'
          + '<button onclick="mas('+i+')" aria-label="Agregar uno">+</button></div>'
          + '<span class="pz">'+n2(lineOf(it))+'</span>';
      }
      h+='</div>';
    }
    h+='<div class="sums">'
     + '<div><span>Subtotal</span><span>'+n2(t.sub)+'</span></div>'
     + '<div><span>ITBMS 7%</span><span>'+n2(t.tax)+'</span></div>'
     + '<div class="big"><span>Total</span><span>B/. '+n2(t.total)+'</span></div></div>'
     + '<div class="code"></div><p class="codetxt">'+String(n).padStart(3,'0')+' ITEMS</p>';
  }
  document.getElementById('ticket').innerHTML=h;
  save();
}
function mas(i){cart[i].cant++;render();}
function menos(i){cart[i].cant--;if(cart[i].cant<=0)cart.splice(i,1);render();}
function quitar(i){cart.splice(i,1);render();}
function setMode(m){
  mode=m;
  document.getElementById('segUnit').className=m==='unit'?'on':'';
  document.getElementById('segWeight').className=m==='weight'?'on':'';
  document.getElementById('wBox').style.display=m==='weight'?'block':'none';
  document.getElementById('mPriceLbl').textContent=m==='weight'?'Precio por libra':'Precio';
}
function openModal(){
  document.getElementById('mErr').style.display='none';
  document.getElementById('modal').style.display='flex';
  setTimeout(function(){document.getElementById('mName').focus();},120);
}
function closeModal(){document.getElementById('modal').style.display='none';editIndex=-1;pendingCode='';}
function editar(i){
  var it=cart[i];editIndex=i;pendingCode=it.codigo;
  document.getElementById('mTitle').textContent='Editar producto';
  document.getElementById('mCode').textContent=it.codigo.indexOf('MAN-')===0?'Sin código de barras':it.codigo;
  document.getElementById('mName').value=it.nombre;
  document.getElementById('mPrice').value=it.precio;
  document.getElementById('mTax').checked=!!it.itbms;
  setMode(it.tipo==='peso'?'weight':'unit');
  document.getElementById('mWeight').value=it.tipo==='peso'?it.peso:'';
  openModal();
}
function nuevoProducto(codigo){
  editIndex=-1;pendingCode=codigo;
  var p=cat[codigo];
  document.getElementById('mTitle').textContent=p?'Confirmar precio':'Producto nuevo';
  document.getElementById('mCode').textContent=codigo.indexOf('MAN-')===0?'Sin código de barras':codigo;
  document.getElementById('mName').value=p?p.nombre:'';
  document.getElementById('mPrice').value=p?p.precio:'';
  document.getElementById('mTax').checked=p?!!p.itbms:false;
  setMode(p&&p.tipo==='peso'?'weight':'unit');
  document.getElementById('mWeight').value='';
  openModal();
}
function guardar(){
  var nombre=document.getElementById('mName').value.trim();
  var precio=parseFloat(document.getElementById('mPrice').value);
  var itbms=document.getElementById('mTax').checked;
  var peso=parseFloat(document.getElementById('mWeight').value);
  var err=document.getElementById('mErr');
  if(!nombre){err.textContent='Ponle un nombre al producto.';err.style.display='block';return;}
  if(!(precio>0)){err.textContent='Escribe un precio mayor que cero.';err.style.display='block';return;}
  if(mode==='weight'&&!(peso>0)){err.textContent='Escribe las libras de la etiqueta.';err.style.display='block';return;}
  var tipo=mode==='weight'?'peso':'unidad';
  cat[pendingCode]={nombre:nombre,precio:precio,tipo:tipo,itbms:itbms};
  if(editIndex>=0){
    var it=cart[editIndex];
    it.nombre=nombre;it.precio=precio;it.itbms=itbms;it.tipo=tipo;
    if(tipo==='peso'){it.peso=peso;it.cant=1;}
  } else if(tipo==='peso'){
    cart.push({codigo:pendingCode,nombre:nombre,precio:precio,itbms:itbms,tipo:'peso',peso:peso,cant:1});
  } else {
    var f=-1;
    for(var i=0;i<cart.length;i++) if(cart[i].codigo===pendingCode&&cart[i].tipo==='unidad') f=i;
    if(f>=0) cart[f].cant++;
    else cart.push({codigo:pendingCode,nombre:nombre,precio:precio,itbms:itbms,tipo:'unidad',cant:1});
  }
  closeModal();render();
}
function agregarPorCodigo(codigo){
  var p=cat[codigo];
  if(!p||p.tipo==='peso'){nuevoProducto(codigo);return;}
  var f=-1;
  for(var i=0;i<cart.length;i++) if(cart[i].codigo===codigo&&cart[i].tipo==='unidad') f=i;
  if(f>=0) cart[f].cant++;
  else cart.push({codigo:codigo,nombre:p.nombre,precio:p.precio,itbms:p.itbms,tipo:'unidad',cant:1});
  render();
}
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    var c=new C(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='square';o.frequency.value=1150;
    g.gain.setValueAtTime(.12,c.currentTime);
    o.start();o.stop(c.currentTime+.09);
    setTimeout(function(){try{c.close();}catch(e){}},300);
  }catch(e){}
}

/* ---- linterna: se muestra solo si el celular la soporta ---- */
function getTrack(){
  var v=document.getElementById('video');
  return (v.srcObject && v.srcObject.getVideoTracks) ? v.srcObject.getVideoTracks()[0] : null;
}
function revisarTorch(intentos){
  var track=getTrack();
  var btn=document.getElementById('btnTorch');
  if(!track){
    if(intentos>0) torchCheckTimer=setTimeout(function(){revisarTorch(intentos-1);},300);
    return;
  }
  var caps={};
  try{caps=track.getCapabilities?track.getCapabilities():{};}catch(e){}
  if(caps && caps.torch) btn.classList.add('show');
  else btn.classList.remove('show');
}
function toggleTorch(){
  var track=getTrack();
  if(!track) return;
  torchOn=!torchOn;
  track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){torchOn=!torchOn;});
  document.getElementById('btnTorch').classList.toggle('on',torchOn);
}

function abrirCamara(){
  if(typeof ZXingBrowser==='undefined'){
    alert('No se pudo cargar el lector de códigos. Revisa tu conexión a internet e intenta de nuevo.');
    return;
  }
  document.getElementById('cam').style.display='block';
  document.getElementById('camhint').textContent='Apunta al código de barras';
  document.getElementById('btnTorch').classList.remove('show','on');
  torchOn=false;
  if(!reader){
    var hints=new Map();
    hints.set(ZXingBrowser.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXingBrowser.DecodeHintType.ASSUME_GS1,true);
    if(ZXingBrowser.DecodeHintType.ALSO_INVERTED){
      hints.set(ZXingBrowser.DecodeHintType.ALSO_INVERTED,true);
    }
    hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,[
      ZXingBrowser.BarcodeFormat.EAN_13,
      ZXingBrowser.BarcodeFormat.EAN_8,
      ZXingBrowser.BarcodeFormat.UPC_A,
      ZXingBrowser.BarcodeFormat.UPC_E,
      ZXingBrowser.BarcodeFormat.CODE_128,
      ZXingBrowser.BarcodeFormat.CODE_39,
      ZXingBrowser.BarcodeFormat.CODE_93,
      ZXingBrowser.BarcodeFormat.CODABAR,
      ZXingBrowser.BarcodeFormat.ITF,
      ZXingBrowser.BarcodeFormat.RSS_14,
      ZXingBrowser.BarcodeFormat.RSS_EXPANDED
    ]);
    reader=new ZXingBrowser.BrowserMultiFormatReader(hints);
  }
  reader.decodeFromConstraints({video:{
    facingMode:{ideal:'environment'},
    width:{ideal:2560},
    height:{ideal:1440},
    advanced:[{focusMode:'continuous'}]
  }},document.getElementById('video'),
    function(result,err,ctrl){
      if(ctrl)controls=ctrl;
      if(!result)return;
      var code=result.getText(),now=Date.now();
      if(code===lastCode&&now-lastTime<2500)return;
      lastCode=code;lastTime=now;beep();
      if(navigator.vibrate)navigator.vibrate(60);
      if(cat[code]&&cat[code].tipo!=='peso'){
        agregarPorCodigo(code);
        document.getElementById('camhint').textContent='Agregado: '+cat[code].nombre;
      } else { cerrarCamara(); agregarPorCodigo(code); }
    }
  ).then(function(){
    revisarTorch(5);
  }).catch(function(){
    cerrarCamara();
    alert('No se pudo abrir la cámara. Revisa el permiso de Safari y que la página abra con https.');
  });
}
function cerrarCamara(){
  try{if(torchOn){var t=getTrack();if(t)t.applyConstraints({advanced:[{torch:false}]}).catch(function(){});}}catch(e){}
  torchOn=false;
  if(torchCheckTimer){clearTimeout(torchCheckTimer);torchCheckTimer=null;}
  try{if(controls)controls.stop();}catch(e){}
  controls=null;document.getElementById('cam').style.display='none';
}
document.getElementById('btnScan').onclick=abrirCamara;
document.getElementById('btnCamClose').onclick=cerrarCamara;
document.getElementById('btnTorch').onclick=toggleTorch;
document.getElementById('btnManual').onclick=function(){nuevoProducto('MAN-'+Date.now());};
document.getElementById('segUnit').onclick=function(){setMode('unit');};
document.getElementById('segWeight').onclick=function(){setMode('weight');};
document.getElementById('mSave').onclick=guardar;
document.getElementById('mCancel').onclick=closeModal;
['mName','mPrice','mWeight'].forEach(function(id){
  document.getElementById(id).oninput=function(){document.getElementById('mErr').style.display='none';};
});
document.getElementById('btnClear').onclick=function(){
  if(!cart.length)return;
  if(confirm('¿Vaciar el ticket? Los precios guardados se quedan.')){cart=[];render();}
};
document.getElementById('btnBudget').onclick=function(){
  var v=prompt('¿Cuánto quieres gastar como máximo? (0 para quitarlo)',budget||'');
  if(v===null)return;
  var n=parseFloat(v);budget=(n>0)?n:0;render();
};
(function(){
  var d=new Date();
  var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var el=document.getElementById('brandDate');
  if(el) el.textContent=d.getDate()+' '+meses[d.getMonth()]+' · '
    +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
})();
load();prevTotal=totals().total;render();
</script>
