<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c1b33"/>
    <stop offset="1" stop-color="#16294a"/>
  </linearGradient>
  
</defs>
<rect width="800" height="600" fill="url(#sky)"/>

  <!-- olas -->
  <path d="M0 430 q100 -30 200 0 t200 0 t200 0 t200 0 V600 H0 Z" fill="#2a4a7a" opacity="0.55"/>
  <path d="M0 470 q100 -30 200 0 t200 0 t200 0 t200 0 V600 H0 Z" fill="#3a5f96" opacity="0.7"/>
  <!-- barco -->
  <g>
    <path d="M230 430 h340 l-40 70 h-260 z" fill="#f1f3f2"/>
    <rect x="300" y="360" width="200" height="70" fill="#16294a" stroke="#f1f3f2" stroke-width="4"/>
    <rect x="320" y="330" width="40" height="34" fill="#ff6a1a"/>
    <rect x="375" y="330" width="40" height="34" fill="#f1f3f2"/>
    <rect x="430" y="330" width="40" height="34" fill="#ff6a1a"/>
  </g>
  <!-- avión -->
  <g transform="translate(540 150) rotate(-15)">
    <path d="M0 40 L150 20 L175 30 L120 55 L60 60 L20 90 L5 88 L20 58 L-5 55 Z" fill="#ff6a1a"/>
    <path d="M70 45 L110 5 L122 8 L98 48 Z" fill="#ff8c47"/>
