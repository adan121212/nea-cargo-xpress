<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c1b33"/>
    <stop offset="1" stop-color="#16294a"/>
  </linearGradient>
  
</defs>
<rect width="800" height="600" fill="url(#sky)"/>

  <!-- carrito -->
  <g stroke="#ff6a1a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 210 h60 l40 180 h230 l40 -130 h-300"/>
    <circle cx="290" cy="440" r="26" fill="#ff6a1a" stroke="none"/>
    <circle cx="470" cy="440" r="26" fill="#ff6a1a" stroke="none"/>
  </g>
  <!-- cajas dentro -->
  <g>
    <rect x="300" y="270" width="90" height="80" rx="6" fill="#f1f3f2"/>
    <rect x="300" y="270" width="90" height="30" rx="6" fill="#ff8c47"/>
    <line x1="345" y1="270" x2="345" y2="350" stroke="#0c1b33" stroke-width="4"/>
    <rect x="410" y="255" width="100" height="95" rx="6" fill="#f1f3f2"/>
    <rect x="410" y="255" width="100" height="34" rx="6" fill="#ff6a1a"/>
    <line x1="460" y1="255" x2="460" y2="350" stroke="#0c1b33" stroke-width="4"/>
  </g>
  <!-- signo compra / cursor -->
  <circle cx="560" cy="180" r="52" fill="#ff6a1a"/>
  <path d="M540 180 h40 M560 160 v40" stroke="#f1f3f2" stroke-width="10" stroke-linecap="round"/>

</svg>